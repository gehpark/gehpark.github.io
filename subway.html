<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTA Downtown Trains - 125 St</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            padding: 20px;
            background: #f4f6f9;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .station-header {
            display: flex;
            align-items: center;
            margin-bottom: 16px;
        }

        .station-name {
            font-size: 28px;
            font-weight: bold;
            color: #222;
        }

        .direction-tag {
            margin-left: 10px;
            font-size: 14px;
            font-weight: 600;
            color: #fff;
            background: #333;
            padding: 4px 10px;
            border-radius: 12px;
        }

        .last-updated {
            color: #666;
            font-size: 14px;
            margin-top: 10px;
        }

        .arrivals-container {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 20px;
            font-weight: bold;
            color: #333;
            margin-top: 14px;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 2px solid #f0f0f0;
        }

        .section-title:first-of-type {
            margin-top: 0;
        }

        .badge {
            display: inline-block;
            color: white;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            text-align: center;
            line-height: 28px;
            font-size: 15px;
            font-weight: bold;
        }

        .badge-23 {
            background: #EE352E;
        }

        .badge-45 {
            background: #00933C;
        }

        .arrival-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #fff5f5 0%, #ffd6d6 100%);
            border-radius: 10px;
            transition: transform 0.2s;
        }

        .arrival-item:hover {
            transform: translateX(5px);
        }

        .route-pill {
            font-size: 18px;
            font-weight: 700;
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
        }

        .route-23 {
            background: #EE352E;
        }

        .route-45 {
            background: #00933C;
        }

        .time {
            font-size: 44px;
            font-weight: bold;
            color: #222;
        }

        .no-trains {
            text-align: center;
            padding: 28px;
            color: #888;
            font-size: 16px;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
            font-size: 16px;
        }

        .error {
            background: #fee;
            border: 1px solid #fcc;
            color: #c33;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="station-header">
            <div class="station-name">125 St</div>
            <div class="direction-tag">Downtown</div>
        </div>

        <div class="arrivals-container">
            <div id="errorContainer"></div>

            <div class="section-title">
                <span class="badge badge-23">2</span>
                <span class="badge badge-23">3</span>
                <span>125 St (Downtown)</span>
            </div>
            <div id="line23Downtown" class="loading">Loading train data...</div>

            <div class="section-title">
                <span class="badge badge-45">4</span>
                <span class="badge badge-45">5</span>
                <span>125 St (Downtown)</span>
            </div>
            <div id="line45Downtown" class="loading">Loading train data...</div>
        </div>

        <div class="last-updated" id="lastUpdated">Loading...</div>
    </div>
